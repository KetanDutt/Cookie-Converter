name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Check & test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['18', '20', '22']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Consistency checks
        run: npm run check

      - name: Unit tests
        run: npm test

  # The whole app is static: prove the shipped files are exactly what a host
  # would receive, and that nothing was accidentally left out.
  package:
    name: Artifact sanity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Required files exist
        run: |
          for file in index.html 404.html sw.js site.webmanifest LICENSE \
                      assets/app.js assets/converter.js assets/style.css assets/favicon.svg \
                      docs/README.md README.md; do
            test -f "$file" || { echo "missing $file"; exit 1; }
          done

      - name: No cookie exports committed
        run: |
          if git ls-files | grep -Ei '(^|/)(cookie|cookies).*\.(txt|json)$'; then
            echo "::error::a cookie export looks committed — remove it and rotate those cookies"
            exit 1
          fi
          echo "clean"
